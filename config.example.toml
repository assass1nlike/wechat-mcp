# 复制为 config.toml 后修改。改完不用重启，每次调用都会重读。

[wechat]
# WeChatDataAnalysis 保存的密钥文件，留空用默认位置 %APPDATA%/wechat-data-analysis-desktop/output/account_keys.json
keys = ""
# 微信的 db_storage 目录，留空用密钥文件里记的路径
storage = ""

# 允许读取的群，只有这里列出的群能被查到。id 在微信数据里是 “数字@chatroom”，name 只是备注
[[groups]]
id = "12345678901@chatroom"
name = "示例群"
